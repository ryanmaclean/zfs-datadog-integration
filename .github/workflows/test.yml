name: Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get install -y shellcheck=0.9.0-1
          test "$(shellcheck --version | awk '/^version:/ {print $2}')" = 0.9.0
          command -v jq

      - name: Full repository ShellCheck audit (legacy findings)
        continue-on-error: true
        run: |
          echo "Checking shell scripts..."
          find scripts/ -name "*.sh" -type f -exec shellcheck -x {} +

      - name: Check tracked shell path integrity
        run: .github/scripts/shell-scripts.sh > "$RUNNER_TEMP/shell-scripts.txt"

      - name: Fail on new ShellCheck findings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$sha" =~ ^0+$ ]]; then
              echo "Invalid base/head commit SHA" >&2
              exit 1
            fi
            git cat-file -e "${sha}^{commit}"
          done

          base="$RUNNER_TEMP/shellcheck-base"
          head="$RUNNER_TEMP/shellcheck-head"
          git worktree add --detach "$base" "$BASE_SHA"
          git worktree add --detach "$head" "$HEAD_SHA"

          fingerprints() {
            local tree="$1" output="$2" label="$3"
            local json="$RUNNER_TEMP/shellcheck-${label}.json"
            local sources="$RUNNER_TEMP/shellcheck-${label}-sources.json"
            local script_list="$RUNNER_TEMP/shellcheck-${label}-scripts.z"
            local source_list="$RUNNER_TEMP/shellcheck-${label}-sources.z"
            local result
            (cd "$tree"; find scripts/ -name '*.sh' -type f -print0 | sort -z) > "$script_list" || return 1
            scripts=()
            while IFS= read -r -d '' script; do
              scripts+=("$script")
            done < "$script_list"
            ((${#scripts[@]} > 0)) || return 1
            (
              cd "$tree"
              shellcheck -x -f json "${scripts[@]}"
            ) > "$json" || result=$?
            if ((${result:-0} > 1)); then
              echo "ShellCheck failed before producing diagnostics for $label" >&2
              return 1
            fi
            jq -e 'type == "array"' "$json" >/dev/null

            (cd "$tree"; find scripts/ -type f -print0 | sort -z) > "$source_list" || return 1
            (
              cd "$tree"
              while IFS= read -r -d '' file; do
                jq -Rs --arg file "$file" '{($file): split("\n")}' < "$file" || exit 1
              done < "$source_list"
            ) | jq -s 'add // {}' > "$sources"

            jq -c --slurpfile sources "$sources" '
              .[] as $d |
              ($sources[0][$d.file] // error("unmapped diagnostic source")) as $lines |
              ($d.endLine // $d.line) as $last |
              if $d.line < 1 or $last < $d.line or $last > ($lines | length) then
                error("invalid diagnostic source span")
              else
                {file: $d.file, code: $d.code, level: $d.level,
                 message: $d.message,
                 source: ($lines[($d.line - 1):$last] | join("\n"))}
              end
            ' "$json" | LC_ALL=C sort > "$output"
          }

          base_fingerprints="$RUNNER_TEMP/shellcheck-base-fingerprints.jsonl"
          head_fingerprints="$RUNNER_TEMP/shellcheck-head-fingerprints.jsonl"
          fingerprints "$base" "$base_fingerprints" base
          fingerprints "$head" "$head_fingerprints" head
          echo "Base findings: $(wc -l < "$base_fingerprints")"
          echo "Head findings: $(wc -l < "$head_fingerprints")"

          # --no-renames treats a rename as a deleted old path and an added new path.
          changed_paths="$RUNNER_TEMP/shellcheck-changed-paths.z"
          deleted_paths="$RUNNER_TEMP/shellcheck-deleted-paths.z"
          if ! git diff --name-only -z --no-renames --diff-filter=ACMT \
            "$BASE_SHA" "$HEAD_SHA" -- scripts/ > "$changed_paths"; then
            echo "Cannot enumerate changed paths" >&2
            exit 1
          fi
          if ! git diff --name-only -z --no-renames --diff-filter=D \
            "$BASE_SHA" "$HEAD_SHA" -- scripts/ > "$deleted_paths"; then
            echo "Cannot enumerate deleted paths" >&2
            exit 1
          fi
          while IFS= read -r -d '' path; do
            [[ "$path" == scripts/* ]] || { echo "Unexpected deleted path" >&2; exit 1; }
            if [ -e "$head/$path" ] || [ -L "$head/$path" ]; then
              echo "Deleted path remains in head" >&2
              exit 1
            fi
          done < "$deleted_paths"

          changed_keys="$RUNNER_TEMP/shellcheck-changed-keys.jsonl"
          : > "$changed_keys"
          while IFS= read -r -d '' path; do
            [[ "$path" == scripts/* ]] || { echo "Unexpected changed path" >&2; exit 1; }
            if [ -L "$head/$path" ] || [ ! -f "$head/$path" ]; then
              echo "Changed head path is not a regular file" >&2
              exit 1
            fi
            patch="$RUNNER_TEMP/shellcheck-path.patch"
            lines="$RUNNER_TEMP/shellcheck-path-lines.txt"
            if ! git diff --unified=0 --no-ext-diff --no-renames \
              "$BASE_SHA" "$HEAD_SHA" -- "$path" > "$patch"; then
              echo "Cannot inspect changed path" >&2
              exit 1
            fi
            if ! awk '
              /^@@/ {
                if ($0 !~ /^@@ -[0-9]+(,[0-9]+)? \+[0-9]+(,[0-9]+)? @@/) exit 2
                split($0, fields, " ")
                span = fields[3]
                sub(/^\+/, "", span)
                split(span, part, ",")
                count = (part[2] == "" ? 1 : part[2])
                for (i = 0; i < count; i++) print part[1] + i
              }' "$patch" > "$lines"; then
              echo "Cannot parse changed-line hunks" >&2
              exit 1
            fi
            if ! jq -Rcn --arg path "$path" 'inputs | [$path, tonumber]' \
              "$lines" >> "$changed_keys"; then
              echo "Cannot encode changed-line keys" >&2
              exit 1
            fi
          done < "$changed_paths"
          LC_ALL=C sort -u "$changed_keys" > "$RUNNER_TEMP/shellcheck-changed-lines.jsonl"
          jq -c '.[] as $d |
                 range($d.line; (($d.endLine // $d.line) + 1)) as $line |
                 [$d.file, $line]' "$RUNNER_TEMP/shellcheck-head.json" |
            LC_ALL=C sort -u > "$RUNNER_TEMP/shellcheck-diagnostic-lines.jsonl"
          comm -12 "$RUNNER_TEMP/shellcheck-changed-lines.jsonl" \
            "$RUNNER_TEMP/shellcheck-diagnostic-lines.jsonl" \
            > "$RUNNER_TEMP/shellcheck-on-changed-lines.jsonl"
          comm -13 "$base_fingerprints" "$head_fingerprints" > "$RUNNER_TEMP/shellcheck-new.jsonl"
          if [ -s "$RUNNER_TEMP/shellcheck-new.jsonl" ] || \
             [ -s "$RUNNER_TEMP/shellcheck-on-changed-lines.jsonl" ]; then
            echo "New ShellCheck findings (including duplicate counts):" >&2
            cat "$RUNNER_TEMP/shellcheck-new.jsonl" >&2
            echo "Findings on added or modified lines:" >&2
            cat "$RUNNER_TEMP/shellcheck-on-changed-lines.jsonl" >&2
            exit 1
          fi
          echo "No new ShellCheck findings"

      - name: Check declared shell dialect
        run: |
          echo "Checking each script with its declared shell..."
          for script in scripts/*.sh; do
            header=$(head -n 1 "$script") || exit 1
            case "$header" in
              '#!/bin/sh') sh -n "$script" ;;
              '#!/bin/bash'|'#!/usr/bin/env bash') bash -n "$script" ;;
              *) echo "Unsupported shell header in $script: $header" >&2; exit 1 ;;
            esac
          done
  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Reject shell paths that line-oriented checks cannot represent
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          cp .github/scripts/shell-scripts.sh "$fixture/lister.sh"
          git -C "$fixture" init -q
          printf '#!/bin/sh\n' > "$fixture/ordinary.sh"
          git -C "$fixture" add ordinary.sh
          (cd "$fixture" && sh ./lister.sh) > "$fixture/list"
          grep -Fx ordinary.sh "$fixture/list"
          for name in "$(printf 'tab\tname.sh')" "$(printf 'line\nbreak.sh')"; do
            printf '#!/bin/sh\n' > "$fixture/$name"
            git -C "$fixture" add -- "$name"
            if (cd "$fixture" && sh ./lister.sh) > "$fixture/list" 2> "$fixture/error"; then
              echo 'Lister accepted an unrepresentable tracked script' >&2
              exit 1
            fi
            test ! -s "$fixture/list"
            grep -F 'refusing incomplete shell-script checks' "$fixture/error"
            git -C "$fixture" rm -q --cached -- "$name"
            rm -- "$fixture/$name"
          done
      
      - name: Validate shell syntax
        run: |
          echo "Validating shell script syntax..."
          .github/scripts/shell-scripts.sh > /tmp/shell-scripts.txt
          while IFS= read -r script; do
            echo "Checking $script"
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" || exit 1 ;;
              *) sh -n "$script" || exit 1 ;;
            esac
          done < /tmp/shell-scripts.txt
          echo "All scripts have valid syntax"

      # Dry-run the VM helpers against argv-recording stubs: QEMU/ssh/scp must
      # get no empty or bundled arguments, and colour output must be real ESC.
      - name: Argument and colour regression test
        run: .github/scripts/test-argv-regressions.sh

      - name: Argument regression rejects quoted tracked paths
        run: |
          tab_name="$(printf 'scripts/pr23-tab\tcase.sh')"
          newline_name="$(printf 'scripts/pr23-line\nbreak.sh')"
          test ! -e "$tab_name"
          test ! -e "$newline_name"
          cleanup() {
            for name in "$tab_name" "$newline_name"; do
              git rm -q --cached -- "$name" 2>/dev/null || true
              rm -f -- "$name"
            done
          }
          trap cleanup EXIT
          for name in "$tab_name" "$newline_name"; do
            printf '#!/bin/sh\n' > "$name"
            git add -- "$name"
            if .github/scripts/test-argv-regressions.sh > /tmp/pr23-argv-test.log 2>&1; then
              echo 'Argument regression accepted an unrepresentable script' >&2
              exit 1
            fi
            grep -F 'Tracked path needs Git quoting; refusing incomplete shell-script checks' /tmp/pr23-argv-test.log
            git rm -q --cached -- "$name"
            rm -- "$name"
          done

  shipped-zedlets:
    name: Shipped Zedlet Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Everything install.sh ships must be plain #!/bin/sh: no bash-required
      # exception, unlike the developer tooling under scripts/.
      - name: Shipped scripts are POSIX sh
        run: .github/scripts/check-shipped-posix.sh

      # Run every shipped zedlet against fixed ZEVENT_* inputs with recording
      # stubs for curl/nc/logger, under sh, dash and bash, and compare the
      # exact Events API payloads and DogStatsD lines with the golden file
      # generated from the pre-cleanup scripts.
      - name: Zedlet payload regression test
        run: .github/scripts/test-zedlet-payloads.sh

  mock-server-test:
    name: Mock Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Start mock Datadog server
        run: |
          python3 mock-datadog-server.py &
          echo $! > mock-server.pid
          sleep 2
      
      - name: Test config template
        run: |
          cp scripts/config.sh.example /tmp/config.sh
          sed -i 's/your_api_key_here/test_key_12345678901234567890123/' /tmp/config.sh
          
      - name: Test zedlet syntax
        run: |
          echo "Testing zedlet scripts..."
          for zedlet in scripts/*-datadog.sh; do
            echo "Syntax check: $zedlet"
            sh -n "$zedlet"
          done
      
      - name: Stop mock server
        if: always()
        run: |
          if [ -f mock-server.pid ]; then
            kill $(cat mock-server.pid) || true
          fi

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check documentation files
        run: |
          echo "Checking required documentation..."
          required_files="README.md INSTALL.md"
          for file in $required_files; do
            if [ -f "$file" ]; then
              echo "  ✓ $file exists"
            else
              echo "  ✗ $file missing"
              exit 1
            fi
          done
      
      - name: Check for broken links (basic)
        run: |
          echo "Checking for obvious broken links in README..."
          if grep -r '\[.*\](.*\.md)' README.md | grep -v '^\s*#'; then
            echo "Found markdown links, verifying..."
            # Extract and check local .md links exist
            grep -o '\[.*\]([^)]*\.md)' README.md | sed 's/.*(\([^)]*\)).*/\1/' | while read link; do
              if [ ! -f "$link" ]; then
                echo "  ✗ Broken link: $link"
                exit 1
              fi
            done
          fi
          echo "  ✓ No broken links found"

  integration-structure:
    name: Integration Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify required files
        run: |
          echo "Checking integration structure..."
          required_scripts=(
            "scripts/install.sh"
            "scripts/uninstall.sh"
            "scripts/config.sh.example"
            "scripts/validate-config.sh"
            "scripts/zfs-datadog-lib.sh"
            "scripts/scrub_finish-datadog.sh"
            "scripts/resilver_finish-datadog.sh"
            "scripts/statechange-datadog.sh"
          )
          
          for script in "${required_scripts[@]}"; do
            if [ -f "$script" ]; then
              echo "  ✓ $script"
            else
              echo "  ✗ $script missing"
              exit 1
            fi
          done
      
      - name: Check script permissions
        run: |
          echo "Checking script executability..."
          for script in scripts/*.sh; do
            if [ -x "$script" ]; then
              echo "  ✓ $script is executable"
            else
              echo "  ✗ $script is not executable"
              exit 1
            fi
          done
